# STU-N2: VN scene with 4 named people, each in their own strip of the picture (generated by tools/studio/gen_cast.py).
title = "VN scene, 4 people"
description = "A visual novel CG with 4 characters; every character has their own prompt and place, so hair and clothes stay with the right person."
graph = "graph.json"
outputs = ["20"]
machines = ["soucouyant"]
vram_mb = 10000
ram_mb = 10000

[studio]
label = "VN scene, 4 people"
hint = "4 characters side by side, each with their own look"
sizes = ["wide"]
order = 24
cast = 4
px = { wide = [1664, 768] }

[[param]]
name = "prompt"
type = "string"
default = "a school rooftop at sunset, wind in their hair"
node = "4"
input = "text"
template = "masterpiece, best quality, amazing quality, very aesthetic, absurdres, newest, {rating}, adult, mature, 4people, group shot, medium shot, everyone in frame, visual novel cg, detailed background, cinematic lighting, {value}"

[[param]]
name = "negative"
type = "string"
default = ""
node = "5"
input = "text"
template = "crowd, extra people, background characters, worst quality, bad quality, low quality, lowres, blurry, jpeg artifacts, watermark, signature, text, logo, bad anatomy, bad hands, extra fingers, missing fingers, fused fingers, extra limbs, deformed, disfigured, mutated, cropped head, extra hands, extra arms, malformed hands, vertical lines, streaks, scan lines, lined paper, child, loli, shota, underage, young child, kid, toddler, teen, minor, childlike body, {rating_neg}{value}"

[[param]]
name = "width"
type = "int"
default = 1664
min = 512
max = 2048
node = "6"
input = "width"

[[param]]
name = "height"
type = "int"
default = 768
min = 512
max = 2048
node = "6"
input = "height"

[[param]]
name = "seed"
type = "seed"
default = -1
node = "7"
input = "seed"
also = [{ node = "62", input = "seed", add = 1 }]

[[param]]
name = "rating"
type = "choice"
default = "general"
choices = ["general", "sensitive", "questionable", "explicit"]
adult = ["questionable", "explicit"]
words = { rating_neg = { general = "nsfw, nude, explicit, " } }

[[param]]
name = "person1"
type = "string"
default = "1girl, long red hair, green eyes, blue school uniform, smiling"
node = "31"
input = "text"
template = "adult, mature, solo, {value}"

[[param]]
name = "person1_x"
type = "float"
default = 0.0
min = 0
max = 1
node = "41"
input = "x"

[[param]]
name = "person1_width"
type = "float"
default = 0.3025
min = 0.2
max = 1
node = "41"
input = "width"

