# STU-C2: a headshot or a cowboy shot of a finished OC sheet's character (the sheet is the source picture).
title = "OC shots"
description = "A headshot (neck up) or a cowboy shot (thighs up) of the character on a finished OC sheet, with the same face, hair, outfit and colours."
graph = "graph.json"
outputs = ["20"]
machines = ["soucouyant"]
vram_mb = 10000
ram_mb = 12000

[studio]
label = "OC shots"
hint = "Headshot or cowboy shot of a sheet's character"
sizes = ["tall", "square"]
order = 106
refine = true
# headshot 1024x1280, cowboy shot 1216x1216 (the 4x model and a 0.5 scale give twice that)
px = { tall = [1024, 1280], square = [1216, 1216] }

[inputs]
source = "10"

[[param]]
name = "prompt"
type = "string"
default = ""
node = "4"
input = "text"
template = "masterpiece, best quality, amazing quality, very aesthetic, absurdres, {rating}, adult, mature, solo, {shot_tags}, {bg}, {helmet_tags}{value}"

[[param]]
name = "negative"
type = "string"
default = ""
node = "5"
input = "text"
template = "worst quality, bad quality, low quality, lowres, blurry, jpeg artifacts, watermark, signature, text, logo, bad anatomy, bad hands, extra fingers, missing fingers, fused fingers, extra limbs, deformed, disfigured, mutated, multiple views, character sheet, reference sheet, turnaround, child, loli, shota, underage, young child, kid, toddler, teen, minor, childlike body, {helmet_neg}{shot_neg}{bg_neg}{rating_neg}{value}"

[[param]]
name = "face_prompt"
type = "string"
default = ""
node = "16"
input = "text"
template = "masterpiece, best quality, amazing quality, very aesthetic, {rating}, adult, mature, {helmet_face}{value}"
fallback = "prompt"

# STU-C2: which shot; the size comes with it (headshot tall, cowboy square, sent by Kreative Studio).
[[param]]
name = "shot"
type = "choice"
default = "headshot"
choices = ["headshot", "cowboy"]
words = { shot_tags = { headshot = "portrait, close-up, head and shoulders, upper body, looking at viewer", cowboy = "cowboy shot, from the thighs up, standing, looking at viewer" }, shot_neg = { headshot = "full body, feet, legs, ", cowboy = "full body, feet, close-up, " } }

[[param]]
name = "background"
type = "choice"
default = "white"
choices = ["white", "starry"]
words = { bg = { white = "simple background, white background", starry = "purple starry night sky background, stars, deep purple to pink gradient sky" }, bg_neg = { white = "gradient background, starry sky, ", starry = "white background, simple background, " } }

[[param]]
name = "width"
type = "int"
default = 1024
min = 1024
max = 1216
node = "6"
input = "width"

[[param]]
name = "height"
type = "int"
default = 1280
min = 1216
max = 1280
node = "6"
input = "height"

[[param]]
name = "seed"
type = "seed"
default = -1
node = "7"
input = "seed"
also = [{ node = "42", input = "seed", add = 2 }]

# How much of the sheet's look (outfit, colours, face) carries over.
[[param]]
name = "likeness"
type = "float"
default = 0.7
min = 0.0
max = 1.0
node = "34"
input = "weight"

# STU-C3: helmet on and off. Kompanion's make turns helmet_desc into two runs with one seed (helmet "on" and
# "off", the same pair id); the words keep the face fix on the helmet when it is on.
[[param]]
name = "helmet"
type = "choice"
default = "none"
node = ""
choices = ["none", "on", "off"]
words = { helmet_tags = { on = "helmet, full helmet covering the head, face hidden, ", off = "no helmet, face visible, bare head, short hair, " }, helmet_neg = { on = "visible face, bare head, ", off = "helmet, headwear, visor, mask, hood, " }, helmet_face = { none = "detailed face, ", on = "helmet, visor, face hidden, ", off = "detailed face, " } }

[[param]]
name = "helmet_desc"
type = "string"
default = ""
node = ""
input = ""

[[param]]
name = "pair"
type = "string"
default = ""
node = ""
input = ""

[[param]]
name = "rating"
type = "choice"
default = "general"
choices = ["general", "sensitive", "questionable", "explicit"]
adult = ["questionable", "explicit"]
words = { rating_neg = { general = "nsfw, nude, explicit, " } }

[[model]]
file = "novaAnimeXL_ilV170.safetensors"
licence = "Fair AI Public License 1.0-SD"

