# STU-C1: OC sheet v2. Four views (front, left, back, right) placed by ControlNet union (OpenPose + depth)
# from a Blender base mesh (tools/pose-sheet), 1344x672 base, 2016x1008 hires, 4x-AnimeSharp to 3024x1512.
# 1536x768 with both controls ran out of VRAM on the 9070 after a fresh load. The first sheet is oc-sheet-classic.
title = "OC sheet"
description = "An original character as a 3024 px reference sheet with four standing views (front, left side, back, right side), SDXL novaAnimeXL with the character sheet and Marvel Rivals style LoRAs, faces and hands fixed."
graph = "graph.json"
outputs = ["20"]
# soucouyant only: the A770 has the files but SDXL + FaceDetailer is not measured there yet.
machines = ["soucouyant"]
vram_mb = 11000
ram_mb = 12000
# STU-C1: SDXL + ControlNet union peaks at ~13 GB torch on the 9070 (1344x672 base), 140-170 s; 11000 + the 2 GB headroom fits next to the desktop (STU-V1b).

# STU-01d: an optional face photo makes the character resemble a person (IP-Adapter plus-face,
# graph-face.json = graph.json plus Kreative Studio's nodes 30-34 with the model rewired).
[face]
graph = "graph-face.json"
image = "30"
weight = "34"

# STU-C1: the pose and depth sheets ship with the workflow and are uploaded to ComfyUI before each run
# (LoadImage node -> file in this folder). Made by tools/pose-sheet (base_mesh.py in Blender, draw_pose.py).
[images]
"60" = "pose.png"
"64" = "depth.png"

[studio]
label = "OC sheet"
hint = "Four views: front, left, back, right"
sizes = ["wide"]
order = 7
px = { wide = [1344, 672] }

[[param]]
name = "prompt"
type = "string"
default = "an adult woman knight with silver hair, a blue cloak and silver armour"
node = "4"
input = "text"
template = "masterpiece, best quality, amazing quality, very aesthetic, absurdres, newest, {rating}, adult, mature, character sheet, character turnaround, reference sheet, multiple views of the same character, full body, front view, side view, from behind, standing, {bg}, {value}"

[[param]]
name = "negative"
type = "string"
default = ""
node = "5"
input = "text"
template = "worst quality, bad quality, low quality, lowres, blurry, jpeg artifacts, watermark, signature, text, logo, bad anatomy, bad hands, extra fingers, missing fingers, fused fingers, extra limbs, deformed, disfigured, mutated, cropped head, extra hands, extra arms, malformed hands, vertical lines, streaks, scan lines, lined paper, {bg_neg}frame, border, panels, child, loli, shota, underage, young child, kid, toddler, teen, minor, childlike body, {rating_neg}{value}"

# STU-R2: the face fix (node 13) gets its own short prompt, so a moustache or eye colour the whole-sheet
# prompt mentions late is not painted away; empty uses the main prompt.
[[param]]
name = "face_prompt"
type = "string"
default = ""
fallback = "prompt"
node = "16"
input = "text"
template = "masterpiece, best quality, amazing quality, very aesthetic, {rating}, adult, mature, detailed face, {value}"

# STU-R2: plain white (the reference sheet) or the purple starry sky seed 304 painted by itself.
[[param]]
name = "background"
type = "choice"
default = "white"
choices = ["white", "starry"]
words = { bg = { white = "simple background, white background", starry = "purple starry night sky background, stars, deep purple to pink gradient sky" }, bg_neg = { white = "gradient background, starry sky, ", starry = "white background, simple background, " } }

[[param]]
name = "width"
type = "int"
default = 1344
min = 1344
max = 1344
node = "6"
input = "width"

[[param]]
name = "height"
type = "int"
default = 672
min = 672
max = 672
node = "6"
input = "height"

[[param]]
name = "seed"
type = "seed"
default = -1
node = "7"
input = "seed"
also = [{ node = "9", input = "seed", add = 1 }, { node = "13", input = "seed", add = 2 }, { node = "15", input = "seed", add = 3 }]
# hires pass, face fix and hand fix use seed+1..3 as in Kreative Studio

[[param]]
name = "rating"
type = "choice"
default = "general"
# STU-01c: as in Kreative Studio; questionable and explicit need the adult-content right
# (kompanion-server user-adult <name> on). {rating} goes into the prompt, {rating_neg} into the
# negative (general keeps out nudity). The adult-only tags stay for every rating.
choices = ["general", "sensitive", "questionable", "explicit"]
adult = ["questionable", "explicit"]
words = { rating_neg = { general = "nsfw, nude, explicit, " } }

[[model]]
file = "novaAnimeXL_ilV170.safetensors"
licence = "Fair AI Public License 1.0-SD"

[[model]]
file = "bbox/face_yolov8m.pt"
licence = "AGPL-3.0"

[[model]]
file = "bbox/hand_yolov8s.pt"
licence = "AGPL-3.0"

[[model]]
file = "sam_vit_b_01ec64.pth"
licence = "Apache-2.0"

[[model]]
file = "character_Sheet_XL.safetensors"
licence = "unknown (Civitai, check the model page)"

[[model]]
file = "ILLUST_STYLE_MarvelRivels_ownwaifu.safetensors"
licence = "unknown (Civitai, check the model page)"

[[model]]
file = "xinsir-union-sdxl-promax.safetensors"
licence = "Apache-2.0"

[[model]]
file = "4x-AnimeSharp.pth"
licence = "CC BY-NC-SA 4.0 (non-commercial; already used by the Studio upscale)"

[[model]]
