[package]
name = "machine-stats"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Linux and Windows machine and GPU stats (/proc and sysfs on Linux, Win32 on Windows), shared by the Kompanion server and runner."

[dependencies]
serde = { version = "1", features = ["derive"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_SystemInformation", "Win32_System_Threading"] }

[dev-dependencies]
serde_json = "1"
