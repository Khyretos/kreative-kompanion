# Tests and builds on both runners (Kees, 2026-10-05: "enable the soucouyant runner as
# well"): the Rust builds on any linux-docker runner (more cores, cargo caches in its Docker
# volumes), the web build and the browser tests on any ubuntu-latest runner (kireserver or the
# Windows PC's WSL runner; 2026-10-19, CI spread over all PCs). AI drafting and Coder stay on
# kireserver.
name: build
on:
  push:
    branches: [main]
  pull_request:

# soucouyant also runs ComfyUI and games: cap parallel compiles.
env:
  CARGO_BUILD_JOBS: "6"

jobs:
  server:
    # Same musl image as the Dockerfile, so C dependencies that break on musl fail here
    # (2026-10-04: sqlite-vec built on glibc in CI but not in the deploy).
    # Cargo runs in a sibling container on the runner's Docker daemon (kompas-builder or
    # windows-wsl) so the registry and target dir live in named volumes between runs; before,
    # every push recompiled every crate.
    runs-on: linux-docker
    container:
      image: docker:cli
    env:
      TOKEN: ${{ github.token }}
      REPO_URL: ${{ github.server_url }}/${{ github.repository }}
      SHA: ${{ github.sha }}
    steps:
      - name: Test the shared stats crate and the server
        run: |
          docker run -i --rm --name "kompanion-ci-server-${{ github.run_number }}" \
            --label kk.ci.repo=${{ github.repository }} --label kk.ci.run=${{ github.run_number }} --label kk.ci.job=server \
            -e TOKEN -e REPO_URL -e SHA -e CARGO_BUILD_JOBS -e CARGO_TARGET_DIR=/cache/target \
            -e CFLAGS="-Du_int8_t=uint8_t -Du_int16_t=uint16_t -Du_int64_t=uint64_t" \
            -v kompanion-cargo-registry:/usr/local/cargo/registry \
            -v kompanion-target-server:/cache/target \
            rust:1-alpine sh -eu <<'BUILD'
          apk add --no-cache -q git musl-dev
          # Start the target dir over when it passes 8 GB, so the cache can't fill the disk.
          [ "$(du -sm /cache/target | cut -f1)" -lt 8000 ] || rm -rf /cache/target/*
          mkdir /src && cd /src && git init -q .
          git -c http.extraHeader="Authorization: token $TOKEN" fetch -q --depth 1 "$REPO_URL" "$SHA" && git checkout -q FETCH_HEAD
          (cd machine-stats && cargo test)
          (cd server && cargo test --locked)
          BUILD

  skills:
    # SK-01: every skill file has a header, model notes only hold model quirks, the loader works.
    runs-on: ubuntu-latest
    container:
      image: node:22 # has python3 too; checkout needs Node
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - name: Skill headers and loader
        run: |
          python3 tools/skills/index.py --check
          python3 -m unittest tools/skills/test_load.py
          python3 -m unittest tools/qwen/test_review_findings.py
          python3 -m unittest tools/qwen/test_reachable.py
          python3 -m unittest tools/test_lint_gate.py
          python3 -m unittest tools/test_anatomy_check.py
      - name: No kill program in Rust code (RUNNER-WIN, procps kill -1)
        run: sh tools/check-no-kill-command.sh
      - name: Host installer (HOST-01, stub docker and curl)
        run: sh tools/test_install_host.sh
      - name: Blender MCP server and installer (BLD-01, fake Blender and systemctl)
        run: |
          python3 tools/blender-mcp/test_server.py
          sh tools/blender-mcp/test_install.sh
          sh tools/blender-mcp/test_install_ondemand.sh
          python3 tools/blender-mcp/check_ondemand.py

  web:
    runs-on: ubuntu-latest
    container:
      image: node:22
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - name: Typecheck and build the web app
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm run build
          node --experimental-strip-types --test --test-force-exit tests-node/*.test.mts

  web-live:
    # Browser tests in demo mode: every page updates without a reload.
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - name: Playwright tests
        working-directory: web
        run: |
          npm ci
          npx playwright test

  runner:
    # Cached the same way as the server job.
    runs-on: linux-docker
    container:
      image: docker:cli
    env:
      TOKEN: ${{ github.token }}
      REPO_URL: ${{ github.server_url }}/${{ github.repository }}
      SHA: ${{ github.sha }}
    steps:
      - name: Build and test the static runner binary
        run: |
          docker run -i --rm --name "kompanion-ci-runner-${{ github.run_number }}" \
            --label kk.ci.repo=${{ github.repository }} --label kk.ci.run=${{ github.run_number }} --label kk.ci.job=runner \
            -e TOKEN -e REPO_URL -e SHA -e CARGO_BUILD_JOBS -e CARGO_TARGET_DIR=/cache/target \
            -v kompanion-cargo-registry:/usr/local/cargo/registry \
            -v kompanion-target-runner:/cache/target \
            rust:1-alpine sh -eu <<'BUILD'
          apk add --no-cache -q git musl-dev
          # Start the target dir over when it passes 8 GB, so the cache can't fill the disk.
          [ "$(du -sm /cache/target | cut -f1)" -lt 8000 ] || rm -rf /cache/target/*
          mkdir /src && cd /src && git init -q .
          git -c http.extraHeader="Authorization: token $TOKEN" fetch -q --depth 1 "$REPO_URL" "$SHA" && git checkout -q FETCH_HEAD
          cd runner && cargo test && cargo build --release
          # (The job token can't write packages; the binary for PCs is copied by hand.)
          ls -l /cache/target/release/kompanion-runner && sha256sum /cache/target/release/kompanion-runner
          BUILD

  runner-windows:
    # RUNNER-WIN: the runner and the shared stats crate must compile for Windows (cross-check from Linux with mingw; the tests run on a Windows PC, see windows.yml).
    runs-on: linux-docker
    container:
      image: docker:cli
    env:
      TOKEN: ${{ github.token }}
      REPO_URL: ${{ github.server_url }}/${{ github.repository }}
      SHA: ${{ github.sha }}
    steps:
      - name: Cross-check the Windows build
        run: |
          docker run -i --rm --name "kompanion-ci-runner-win-${{ github.run_number }}" \
            --label kk.ci.repo=${{ github.repository }} --label kk.ci.run=${{ github.run_number }} --label kk.ci.job=runner-windows \
            -e TOKEN -e REPO_URL -e SHA -e CARGO_BUILD_JOBS -e CARGO_TARGET_DIR=/cache/target \
            -v kompanion-cargo-registry-bookworm:/usr/local/cargo/registry \
            -v kompanion-target-win:/cache/target \
            rust:1-bookworm sh -eu <<'BUILD'
          apt-get update -qq >/dev/null && apt-get install -y -qq git gcc-mingw-w64-x86-64 >/dev/null
          rustup target add x86_64-pc-windows-gnu >/dev/null 2>&1
          # Start the target dir over when it passes 8 GB, so the cache can't fill the disk.
          [ "$(du -sm /cache/target | cut -f1)" -lt 8000 ] || rm -rf /cache/target/*
          mkdir /src && cd /src && git init -q .
          git -c http.extraHeader="Authorization: token $TOKEN" fetch -q --depth 1 "$REPO_URL" "$SHA" && git checkout -q FETCH_HEAD
          cd runner && cargo check --locked --target x86_64-pc-windows-gnu --all-targets
          BUILD

# The container image is built where it is deployed (tools/deploy.sh on kireserver),
# not in CI: the runner's Docker daemon is its own dind, not the host's.
