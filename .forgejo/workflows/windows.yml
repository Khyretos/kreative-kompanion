# RUNNER-WIN: runs the stats crate and runner tests natively on Windows. Needs a Forgejo runner registered with the label `windows` (host mode, Rust and Git installed); until one exists the job just stays queued, so this workflow only runs by hand (Run workflow) or on pushes to main that touch the runner, never on pull requests. Add `pull_request` here once the runner exists.
# The runner on the Windows PC must run as the logged-in user (an interactive session): from a service session git.exe fails with 0xc0000142.
name: windows
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - machine-stats/**
      - runner/**
      - .forgejo/workflows/windows.yml

jobs:
  runner:
    runs-on: windows
    defaults:
      run:
        shell: cmd
    steps:
      # The Windows runner's PATH has no cargo (only msys2's) and PowerShell scripts are blocked there, so every step runs in cmd.
      - name: Put cargo on the PATH (msys2 ucrt64)
        run: echo C:\msys64\ucrt64\bin>> "%GITHUB_PATH%"
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4

      - name: Test the shared stats crate
        working-directory: machine-stats
        run: cargo test --locked

      # Only the Windows-ready tests run here: the runner's grants, file, shell and process tests assume unix paths (grant targets must start with /), RUNNER-WIN-2.
      - name: Test the runner
        working-directory: runner
        run: "cargo test --locked -- platform:: winsetup:: replace_tests:: sha_ok"

      - name: Build the runner
        working-directory: runner
        run: cargo build --release --locked

      - name: Runner starts
        working-directory: runner
        run: .\target\release\kompanion-runner.exe --version
