# CI-MERGE: merge a pull request by itself once every required check is green and the review
# gate (tools/qwen/review_findings.py) exits 0. Kees no longer merges by hand.
# The job never waits: it looks at each open PR once and exits, so it cannot hold the
# kireserver runner (capacity 1) that the build jobs need. It runs again on every PR event,
# every comment (PR-Agent's review, the lint summary) and every 10 minutes, so whichever
# check finishes last still gets its merge.
# Needs the repo secret AUTO_MERGE_TOKEN: a Forgejo token of the repo owner (scopes
# write:repository and write:issue). A merge made with the job token starts no CI on main.
# Skipped: drafts ("WIP:"/"Draft:" titles), PRs with the label no-auto-merge, forks.
# Settings (required checks, label): .forgejo/auto-merge.json. Code: tools/auto_merge.py.
name: auto-merge
enable-email-notifications: false
on:
  pull_request:
    types: [opened, reopened, synchronize, edited, labeled, unlabeled]
  issue_comment:
    types: [created, edited]
  schedule:
    - cron: "*/10 * * * *"

concurrency:
  group: auto-merge
  cancel-in-progress: false

jobs:
  merge:
    # A comment on an issue (not a PR) has nothing to merge.
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    runs-on: kireserver
    timeout-minutes: 15
    container:
      image: node:22 # has python3 and git
    env:
      FORGEJO_API: ${{ github.server_url }}/api/v1
      REPO: ${{ github.repository }}
      READ_TOKEN: ${{ github.token }}
      MERGE_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN }}
    steps:
      - name: Check out main (plain git; trusted code, never the PR's)
        run: |
          git init -q . && git config core.autocrlf false
          git remote add origin "${{ github.server_url }}/${{ github.repository }}"
          git config http.extraHeader "Authorization: token ${{ github.token }}"
          git fetch -q origin main && git checkout -q -B main FETCH_HEAD
      - name: Merge what is ready
        run: |
          [ -f tools/auto_merge.py ] || { echo "tools/auto_merge.py is not on main yet (the PR that adds it): nothing to do"; exit 0; }
          if [ -z "$MERGE_TOKEN" ]; then echo "secret AUTO_MERGE_TOKEN is not set: dry run only"; python3 tools/auto_merge.py --dry-run; exit 0; fi
          python3 tools/auto_merge.py
