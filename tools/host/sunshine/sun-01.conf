# SUN-01: Ensure Sunshine only starts inside a live Hyprland session to prevent restart loops.

[Unit]
StartLimitIntervalSec=300
StartLimitBurst=5

[Service]
ExecCondition=/bin/sh -c 'test -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" && test -S "$XDG_RUNTIME_DIR/hypr/$HYPRLAND_INSTANCE_SIGNATURE/.socket.sock"'
Restart=on-failure
RestartSec=5s
