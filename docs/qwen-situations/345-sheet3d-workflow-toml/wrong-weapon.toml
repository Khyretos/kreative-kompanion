# STU-SHEET3D: weapon sheet. One weapon from four sides (front, right side, back, left side) in four cells divided
# by black lines (MLSD union control + lines painted before the hires pass and on the final picture). No people, so no
# pose or depth control and no face or hand fix. 1344x672 base, 3024x1512 out. vram_mb PROVISIONAL until measured.
title = "Weapon sheet"
description = "One weapon as a reference sheet from four sides (front, right, back, left) in cells divided by black lines, ready to cut out for a 3D model."
graph = "graph.json"
outputs = ["20"]
machines = ["soucouyant"]
vram_mb = 10000
ram_mb = 12000

[studio]
px = { wide = [1344, 672] }
order = 9

[images]
"80" = "lines.png"
"93" = "lines-final.png"
# built by tools/pose-sheet/sheet_v3.py weapon

[[param]]
name = "prompt"
type = "string"
default = "an ornate silver longsword with a blue gem in the hilt"
node = "4"
input = "text"
template = "masterpiece, best quality, amazing quality, very aesthetic, absurdres, newest, {rating}, weapon design sheet, reference sheet, a single weapon shown from four sides, front view, side view, back view, isolated object, no humans, panels divided by black lines, {bg}, {value}"

[[param]]
name = "negative"
type = "string"
default = ""
node = "5"
input = "text"
template = "worst quality, bad quality, low quality, lowres, blurry, jpeg artifacts, watermark, signature, text, logo, person, people, human, hand, holding, character, multiple weapons, different weapons, cropped, {bg_neg}{rating_neg}{value}"

[[param]]
name = "background"
type = "choice"
default = "white"
choices = ["white", "starry"]
words = { bg = { white = "simple background, white background", starry = "purple starry night sky background, stars, deep purple to pink gradient sky" }, bg_neg = { white = "gradient background, starry sky, ", starry = "white background, simple background, " } }

[[param]]
name = "width"
type = "int"
default = 1344
min = 1344
max = 1344
node = "6"
input = "width"

[[param]]
name = "height"
type = "int"
default = 672
min = 672
max = 672
node = "6"
input = "height"

[[param]]
name = "seed"
type = "seed"
default = -1
node = "7"
input = "seed"
also = [{ node = "9", input = "seed", add = 1 }]
# the hires pass uses seed+1

[[param]]
name = "rating"
type = "choice"
default = "general"
choices = ["general", "sensitive", "questionable", "explicit"]
adult = ["questionable", "explicit"]
words = { rating_neg = { general = "nsfw, nude, explicit, " } }

[[model]]
file = "novaAnimeXL_ilV170.safetensors"
licence = "Fair AI Public License 1.0-SD"

[[model]]
file = "character_Sheet_XL.safetensors"
licence = "unknown (Civitai, check the model page)"

[[model]]
file = "ILLUST_STYLE_MarvelRivels_ownwaifu.safetensors"
licence = "unknown (Civitai, check the model page)"

[[model]]
file = "xinsir-union-sdxl-promax.safetensors"
licence = "Apache-2.0"

[[model]]
file = "4x-AnimeSharp.pth"
licence = "CC BY-NC-SA 4.0 (non-commercial; already used by the Studio upscale)"
