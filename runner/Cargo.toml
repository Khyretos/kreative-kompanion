[package]
name = "kompanion-runner"
version = "0.6.5"
edition = "2024"
license = "MIT"
description = "Reports a PC's stats to a Kreative Kompanion server (milestone 2, first slice)."

[dependencies]
machine-stats = { path = "../machine-stats" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
