# One-file deploy: docker compose up -d, then open http://<this computer>:8080 (or your domain).
# The first start prints a setup code: docker compose logs kompanion
# Everything else is optional: settings in .env (see .env.example), your own kompanion.toml and
# extra mounts in docker-compose.override.yml (see docker-compose.override.example.yml).
# Phone push via ntfy (optional): set KOMPANION_NTFY_URL in .env, then docker compose --profile push up -d
services:
  kompanion:
    build: .
    image: ${KOMPANION_IMAGE:-kreative-kompanion:latest}
    restart: unless-stopped
    ports:
      - "${KOMPANION_PORT:-8080}:8080" # every interface; KOMPANION_PORT=127.0.0.1:8080 keeps it to this computer
    extra_hosts:
      - "host.docker.internal:host-gateway" # reach a model server on this PC (e.g. Ollama) on Linux too
    env_file:
      - path: .env # optional settings and API keys
        required: false
    volumes:
      - kompanion-data:/data
      - ${KOMPANION_SKILLS_LOCAL_DIR:-kompanion-skills-local}:/skills-local:ro # private skill cards of this setup (SK-03), may be empty
      # Studio outputs (M6-05): set KOMPANION_GENERATED_DIR to a host folder and [studio]
      # output_dir under /generated; the group of that folder writes it (KOMPANION_GENERATED_GID).
      - ${KOMPANION_GENERATED_DIR:-kompanion-generated}:/generated
    group_add: ["${KOMPANION_GENERATED_GID:-10001}"]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  ntfy:
    profiles: [push]
    image: binwiederhier/ntfy:v2.11.0
    command: ["serve"]
    restart: unless-stopped
    environment:
      NTFY_BASE_URL: ${KOMPANION_NTFY_URL:-}
      NTFY_BEHIND_PROXY: "true"
      NTFY_CACHE_FILE: /var/cache/ntfy/cache.db
    ports:
      - "${KOMPANION_NTFY_PORT:-127.0.0.1:8081}:80" # put your HTTPS reverse proxy in front
    volumes:
      - ntfy-cache:/var/cache/ntfy
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE] # port 80 inside the container
    security_opt: ["no-new-privileges:true"]

  # STU-C4 (optional): the OC sheet's anatomy check. Start with --profile anatomy (or COMPOSE_PROFILES=anatomy in
  # .env), put face_yolov8m.pt and hand_yolov8s.pt in KOMPANION_ANATOMY_MODELS and set [studio] anatomy_url =
  # "http://anatomy:8000" in kompanion.toml. CPU only, about 2 s per sheet.
  anatomy:
    profiles: [anatomy]
    build: tools/anatomy
    image: kk-anatomy:local
    restart: unless-stopped
    volumes:
      - ${KOMPANION_ANATOMY_MODELS:-./anatomy-models}:/models:ro
      # STU-PE3: yolox_l.onnx and dw-ll_ucoco_384.onnx (yzd-v/DWPose) for POST /pose, the Studio's pose check
      - ${KOMPANION_POSE_MODELS:-./pose-models}:/pose-models:ro
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

volumes:
  kompanion-data:
  kompanion-generated:
  kompanion-skills-local:
  ntfy-cache:
