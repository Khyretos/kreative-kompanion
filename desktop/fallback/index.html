<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kreative Kompanion</title>
<!-- Client mode (REL-01): pick the Kompanion server this app connects to. Shown on first
     start and from the tray's "Change server"; main.rs remembers the choice. -->
<style>
  :root {
    --bg: #0c0917; --card: #1c1329; --line: #2c1f3f; --text: #f4eefc; --muted: #cca9ff;
    --accent: #f3941f; --on-accent: #0c0917; --error: #ffb4a8;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4eefc; --card: #ffffff; --line: #cca9ff; --text: #0c0917; --muted: #5c398e;
      --accent: #f3941f; --on-accent: #0c0917; --error: #9b1c1c;
      color-scheme: light;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
    background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main {
    width: 100%; max-width: 440px; background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 28px;
  }
  h1 { margin: 0 0 4px; font-size: 22px; }
  p { margin: 0 0 20px; color: var(--muted); }
  label { display: block; font-weight: 600; margin-bottom: 6px; }
  input {
    width: 100%; padding: 10px 12px; font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--line); border-radius: 8px;
  }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button {
    margin-top: 16px; width: 100%; min-height: 44px; font: inherit; font-weight: 600;
    color: var(--on-accent); background: var(--accent); border: 0; border-radius: 8px; cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: progress; }
  #error { min-height: 1.5em; margin: 12px 0 0; color: var(--error); }
</style>
</head>
<body>
<main>
  <h1>Connect to a Kompanion server</h1>
  <p>Enter the address of the server you use, the same one you would open in a browser.</p>
  <form id="form">
    <label for="url">Server address</label>
    <input id="url" type="text" inputmode="url" autocomplete="url" spellcheck="false"
           placeholder="https://kompanion.example.com" required>
    <button id="go" type="submit">Connect</button>
    <p id="error" role="alert"></p>
  </form>
</main>
<script>
  const invoke = window.__TAURI__.core.invoke;
  const input = document.getElementById("url");
  const go = document.getElementById("go");
  const error = document.getElementById("error");

  invoke("server_choice").then((choice) => {
    input.value = choice.current || choice.suggested || "";
    input.focus();
  });

  document.getElementById("form").addEventListener("submit", async (event) => {
    event.preventDefault();
    error.textContent = "";
    go.disabled = true;
    go.textContent = "Connecting…";
    try {
      await invoke("connect", { address: input.value });
    } catch (message) {
      error.textContent = String(message);
      go.disabled = false;
      go.textContent = "Connect";
    }
  });
</script>
</body>
</html>
